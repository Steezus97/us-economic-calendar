name: Test Trading Economics access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python probe_tradingeconomics.py
      - uses: actions/upload-artifact@v4
        with:
          name: tradingeconomics-access-test
          path: tradingeconomics-access-test.json
